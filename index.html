<title>Laporan Pentashihan Mushaf</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d2420;--mu:#68716b;--ac:#1f6b4f;--ac2:#e3f1ea;--bd:#d9ddd8;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1e2723;--tx:#eaf0ec;--mu:#9aa69f;--ac:#5fc79a;--ac2:#23382f;--bd:#334039;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1e2723;--tx:#eaf0ec;--mu:#9aa69f;--ac:#5fc79a;--ac2:#23382f;--bd:#334039;--bad:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:6px 0 10px}h2{font-size:15px;margin:14px 0 6px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{padding:12px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 15px system-ui;width:100%;margin-top:10px}
.btn.s{background:var(--ac2);color:var(--ac)}.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.a{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.a:first-of-type{border-top:0}.a span{flex:1;font-size:14px}.a small{display:block;color:var(--mu);font-size:11px}
.m{width:46px;height:40px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);font-size:20px;font-weight:700}
.m.s1{background:var(--ac);color:#fff;border-color:var(--ac)}.m.s2{background:var(--bad);color:#fff;border-color:var(--bad)}
.ims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.ims div{font-size:12px;color:var(--mu)}.ims img{width:100%;height:70px;object-fit:contain;background:var(--bg);border:1px solid var(--bd);border-radius:6px;display:block}
.pv{height:70px;border:1px dashed var(--bd);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu)}
.t{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.t button{border:0;background:none;color:var(--bad);font-size:13px}
.note{font-size:13px;color:var(--mu)}
:root{--bg:#f3f0e8;--card:#fffdf9;--tx:#1b2a24;--mu:#6d776f;--ac:#14503b;--ac2:#e5eee8;--bd:#e5e0d4;--gold:#b08d4a;--bad:#a3322a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1613;--card:#18211d;--tx:#eef2ee;--mu:#98a39b;--ac:#5fc79a;--ac2:#1f3229;--bd:#2b3932;--gold:#d4b46a;--bad:#ff8f85}}
:root[data-theme="dark"]{--bg:#0f1613;--card:#18211d;--tx:#eef2ee;--mu:#98a39b;--ac:#5fc79a;--ac2:#1f3229;--bd:#2b3932;--gold:#d4b46a;--bad:#ff8f85}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{padding:14px 14px 40px}
.hero{background:linear-gradient(135deg,#0e3b2b,#1b6a4d);color:#fff;border-radius:20px;padding:20px 20px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:20px;bottom:0;width:56px;height:3px;background:#d4b46a;border-radius:3px}
.hero .ey{font-size:11px;letter-spacing:.16em;color:#d4b46a;font-weight:600}
.hero h1{font:600 26px/1.2 Fraunces,Georgia,serif;margin:6px 0 4px;color:#fff}
.hero p{margin:0;font-size:13px;color:#cfe3d9}
h2{font:600 17px Fraunces,Georgia,serif;margin:20px 2px 8px;color:var(--tx)}
nav{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:2px}
nav button{border:0;background:transparent;color:var(--mu);border-radius:10px;font:500 13.5px Inter,system-ui;padding:10px 2px}
nav button.on{background:var(--ac);color:#fff;box-shadow:0 2px 8px rgba(20,80,59,.25)}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(20,60,45,.07);padding:16px}
label{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--mu)}
input,textarea{background:var(--card);border-radius:10px;padding:11px 12px}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent}
input[type=file]{border:1px dashed var(--bd);font-size:13px;margin-top:6px}
.btn{background:linear-gradient(135deg,#14503b,#1f7a58);border-radius:12px;padding:14px;box-shadow:0 6px 16px rgba(20,80,59,.25);letter-spacing:.01em}
.btn.s,.btn.d{box-shadow:none;background:transparent}
.btn.d{border:1px solid var(--bd)}
.t{font:600 15px Fraunces,Georgia,serif}
.m{border-radius:10px;font-size:18px}
.a{padding:10px 0;border-top:1px solid var(--bd)}
.fld{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);font-size:13px;color:var(--mu)}
.fld b{color:var(--tx);font-weight:600;font-size:13.5px}
.t2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;background:var(--ac2);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ac);font:500 12.5px Inter,system-ui;padding:6px 14px;border-radius:7px}
.seg button.on{background:var(--ac);color:#fff}
.big{width:100%;height:110px;object-fit:contain;background:var(--bg);border:1px solid var(--bd);border-radius:10px;display:block}
.pv{height:80px;border-radius:10px}
.ar{font:22px/1.8 Amiri,"Traditional Arabic",serif;text-align:right}
.fld .pv+input,.fld .big+input{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{width:100%;padding:11px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
select:focus{outline:2px solid var(--ac);outline-offset:-1px}
.tb{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.tb button{min-width:38px;height:36px;padding:0 11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;font:500 13px Inter,system-ui}.tb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.tb .sp{width:6px}
.fld select{margin-bottom:8px}
label{margin:14px 0 6px;line-height:1.3}
.t+label,.t+.row2>div>label,.t+.f>label,.t+.row2 label{margin-top:12px}
.f{min-width:0}.row2>*{min-width:0}
input,select,textarea{font-size:16px}
input:not([type=file]),select{height:46px;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left;padding-right:8px}
input[type=date]::-webkit-date-and-time-value{text-align:left}
select{-webkit-appearance:none;appearance:none;padding-right:36px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px}
textarea{line-height:1.5;resize:vertical}
.card>.t{margin-bottom:2px}
.rm{border:0;background:none;color:var(--bad);font-size:13px;padding:6px}
.a small b{color:var(--tx)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}.ctl>span:last-child{display:flex;gap:6px}
.mv{min-width:38px;height:34px;padding:0 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:500 13px Inter,system-ui}.mv:disabled{opacity:.3}
